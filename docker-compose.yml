services:
  ### THE USER INPUTS HERE ARE THE FF:
  #### CONSUMER_THREADS, QUEUE_SIZE, AND PRODUCER_THREADS
  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    container_name: consumer
    ports:
      - "3000:3000"
      - "50051:50051"
    volumes:
      - "./consumer/storage:/app/consumer/storage"
    environment:
      - QUEUE_SIZE=10
      - CONSUMER_THREADS=4
    networks:
      - upload-network
  
  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: producer
    depends_on:
      - consumer
    volumes:
      - "./producer/storage:/app/producer/storage"
    environment:
      - CONSUMER_HOST=consumer
      - CONSUMER_PORT=50051
      - PRODUCER_THREADS=4
    networks:
      - upload-network

networks:
  upload-network:
    driver: bridge
